[project]
name = "keitaro-wrapper"
version = "0.1.0"
description = "Обёртка над Keitaro: создание кампаний и редактор офферов в потоках"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2",
    "pycountry>=24.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "live: тесты против настоящего Keitaro (нужен KEITARO_API_KEY), запуск: pytest -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
