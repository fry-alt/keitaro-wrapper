{# Иконки: inline SVG, цвет наследуется от текста #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "refresh" %}<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5"/>
{%- elif name == "external" %}<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
{%- elif name == "copy" %}<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
{%- elif name == "pin" %}<path d="M12 17v5"/><path d="M9 10.76V6h6v4.76a2 2 0 0 0 1.11 1.79l1.78.9A2 2 0 0 1 19 15.24V17H5v-1.76a2 2 0 0 1 1.11-1.79l1.78-.9A2 2 0 0 0 9 10.76z"/><path d="M8 6h8"/>
{%- elif name == "upload" %}<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>
{%- elif name == "undo" %}<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
{%- elif name == "trash" %}<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>
{%- elif name == "chevron" %}<path d="m9 18 6-6-6-6"/>
{%- elif name == "check" %}<path d="M20 6 9 17l-5-5"/>
{%- elif name == "alert" %}<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
{%- elif name == "lock" %}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == "logout" %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
{%- elif name == "download" %}<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
{%- elif name == "logo" %}<path d="M4 7h10M4 12h16M4 17h7"/><circle cx="18" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>
{%- endif %}
</svg>
{%- endmacro %}
